# Railway: build bằng Dockerfile, healthcheck /health
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables của Railway, KHÔNG ghi ở đây.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
